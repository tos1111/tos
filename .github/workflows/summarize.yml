name: Summarize

on:
  push:
    branches: [main]
    
jobs:
  fetch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 
      - name: Fetch test file
        env:
          TOKEN: ${{ secrets.TOKEN1 }}
          URL: ${{ secrets.URL1 }}
        run: |
          curl -sSL \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "$URL"
            
      - name: Verify file downloaded
        run: |
          if [ -s test.txt ]; then
            echo "Fetched successfully ($(wc -c < test.txt) bytes)"
            cat test.txt
          else
            echo "Failed to fetch"
            exit 1
          fi
