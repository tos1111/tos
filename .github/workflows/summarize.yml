name: Summarize
on:
  push:
    branches: [main]
jobs:
  fetch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch test file
        env:
          TOKEN: ${{ secrets.TOKEN1 }}
          URL: ${{ secrets.URL1 }}
        run: |
          RESPONSE=$(curl -sSL \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "$URL")

          if [ -n "$RESPONSE" ]; then
            echo "Fetched successfully ($(echo -n "$RESPONSE" | wc -c) bytes)"
            echo "$RESPONSE"
          else
            echo "Failed to fetch — empty response"
            exit 1
          fi
