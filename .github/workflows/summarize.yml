name: Summarize

on:
  pull_request:
    types: [closed]

jobs:
  fetch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch test file
        env:
          TOKEN: ${{ secrets.TOKEN1 }}
          URL: ${{ secrets.URL1 }}
        run: |
          curl -sSL \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            -o prompt.txt \
            "$URL"

      - name: Verify file downloaded
        run: |
          if [ -s prompt.txt ]; then
            echo "Fetched successfully ($(wc -c < prompt.txt) bytes)"
            cat prompt.txt
          else
            echo "Failed to fetch"
            exit 1
          fi
